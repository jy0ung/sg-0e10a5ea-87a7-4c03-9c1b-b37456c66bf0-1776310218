name: Database Backup

on:
  schedule:
    # Nightly at 18:30 UTC.
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment whose database should be backed up'
        type: choice
        required: true
        default: production
        options:
          - production
          - uat
          - staging

permissions:
  contents: read

concurrency:
  group: db-backup-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  logical-dump:
    name: Logical dump (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'production' }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DB_BACKUP_GPG_PASSPHRASE: ${{ secrets.DB_BACKUP_GPG_PASSPHRASE }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}
      DB_BACKUP_S3_BUCKET: ${{ secrets.DB_BACKUP_S3_BUCKET }}
      DB_BACKUP_S3_PREFIX: ${{ secrets.DB_BACKUP_S3_PREFIX || 'flc-bi/db-backups' }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve backup transport
        id: transport
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DB_BACKUP_GPG_PASSPHRASE:-}" ]]; then
            echo "Missing required secret: DB_BACKUP_GPG_PASSPHRASE" >&2
            exit 1
          fi

          if [[ -n "${SUPABASE_DB_URL:-}" ]]; then
            echo "mode=direct" >> "$GITHUB_OUTPUT"
            echo "Using direct Postgres backup transport."
            exit 0
          fi

          missing=0
          for name in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS SSH_HOST SSH_USER CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing SSH backup secret: ${name}" >&2
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Backup requires either SUPABASE_DB_URL or the complete Cloudflare Access SSH credential set." >&2
            exit 1
          fi

          echo "mode=ssh" >> "$GITHUB_OUTPUT"
          echo "Using Cloudflare Access SSH backup transport; no database URL is exposed to the runner."

      - name: Install backup tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client gnupg

      - name: Install cloudflared
        if: steps.transport.outputs.mode == 'ssh'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Configure SSH backup transport
        if: steps.transport.outputs.mode == 'ssh'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_backup
          chmod 600 ~/.ssh/id_backup
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host backup-target
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/id_backup
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ProxyCommand cloudflared access ssh --hostname %h
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

      - name: Capture backup source metadata
        id: source
        shell: bash
        env:
          BACKUP_TRANSPORT: ${{ steps.transport.outputs.mode }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          database_image=""
          database_container=""

          if [[ "$BACKUP_TRANSPORT" == "direct" ]]; then
            postgres_version="$(PGDATABASE="$SUPABASE_DB_URL" psql -t -A -v ON_ERROR_STOP=1 -c 'show server_version;')"
          elif [[ "$BACKUP_TRANSPORT" == "ssh" ]]; then
            database_container="$(
              ssh -T backup-target "docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -1"
            )"
            if [[ -z "$database_container" ]]; then
              echo "No production Supabase DB container matched ^supabase_db_" >&2
              exit 1
            fi

            database_image="$(
              ssh -T backup-target "docker inspect -f '{{.Config.Image}}' '$database_container'"
            )"
            postgres_version="$(
              ssh -T backup-target "docker exec '$database_container' psql -U postgres -d postgres -t -A -v ON_ERROR_STOP=1 -c 'show server_version;'"
            )"
          else
            echo "Unsupported backup transport: $BACKUP_TRANSPORT" >&2
            exit 1
          fi

          echo "database_container=$database_container" >> "$GITHUB_OUTPUT"
          echo "database_image=$database_image" >> "$GITHUB_OUTPUT"
          echo "postgres_version=$postgres_version" >> "$GITHUB_OUTPUT"

      - name: Create encrypted logical dump
        id: dump
        shell: bash
        env:
          BACKUP_TRANSPORT: ${{ steps.transport.outputs.mode }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p backup
          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          dump_file="backup/${TARGET_ENV}-${timestamp}.dump"
          encrypted_file="${dump_file}.gpg"
          checksum_file="${encrypted_file}.sha256"
          metadata_file="${encrypted_file}.metadata.txt"

          cleanup_plaintext() {
            rm -f "$dump_file"
          }
          trap cleanup_plaintext EXIT

          if [[ "$BACKUP_TRANSPORT" == "direct" ]]; then
            PGDATABASE="$SUPABASE_DB_URL" pg_dump \
              --format=custom \
              --no-owner \
              --no-privileges \
              --file "$dump_file"
          elif [[ "$BACKUP_TRANSPORT" == "ssh" ]]; then
            db_container="${{ steps.source.outputs.database_container }}"
            if [[ -z "$db_container" ]]; then
              echo "Backup source metadata did not resolve a database container." >&2
              exit 1
            fi
            ssh -T backup-target \
              "docker exec '$db_container' pg_dump -U postgres -d postgres --format=custom --no-owner --no-privileges" \
              > "$dump_file"
          else
            echo "Unsupported backup transport: $BACKUP_TRANSPORT" >&2
            exit 1
          fi

          test -s "$dump_file"
          pg_restore --list "$dump_file" >/dev/null

          printf '%s' "$DB_BACKUP_GPG_PASSPHRASE" | gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase-fd 0 \
            --symmetric \
            --cipher-algo AES256 \
            --output "$encrypted_file" \
            "$dump_file"

          cleanup_plaintext
          sha256sum "$encrypted_file" > "$checksum_file"
          sha256sum -c "$checksum_file"

          {
            echo "environment=$TARGET_ENV"
            echo "created_at_utc=$timestamp"
            echo "transport=$BACKUP_TRANSPORT"
            echo "database_image=${{ steps.source.outputs.database_image }}"
            echo "postgres_version=${{ steps.source.outputs.postgres_version }}"
            echo "github_sha=$GITHUB_SHA"
            echo "github_run_id=$GITHUB_RUN_ID"
          } > "$metadata_file"

          echo "encrypted_file=${encrypted_file}" >> "$GITHUB_OUTPUT"
          echo "checksum_file=${checksum_file}" >> "$GITHUB_OUTPUT"
          echo "metadata_file=${metadata_file}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$(basename "$encrypted_file")" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted dump to S3
        if: ${{ env.DB_BACKUP_S3_BUCKET != '' }}
        run: |
          set -euo pipefail
          aws s3 cp "${{ steps.dump.outputs.encrypted_file }}" \
            "s3://${DB_BACKUP_S3_BUCKET}/${DB_BACKUP_S3_PREFIX}/${TARGET_ENV}/${{ steps.dump.outputs.artifact_name }}" \
            --sse AES256
          aws s3 cp "${{ steps.dump.outputs.checksum_file }}" \
            "s3://${DB_BACKUP_S3_BUCKET}/${DB_BACKUP_S3_PREFIX}/${TARGET_ENV}/${{ steps.dump.outputs.artifact_name }}.sha256" \
            --sse AES256
          aws s3 cp "${{ steps.dump.outputs.metadata_file }}" \
            "s3://${DB_BACKUP_S3_BUCKET}/${DB_BACKUP_S3_PREFIX}/${TARGET_ENV}/${{ steps.dump.outputs.artifact_name }}.metadata.txt" \
            --sse AES256

      - name: Upload encrypted dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.artifact_name }}
          path: |
            ${{ steps.dump.outputs.encrypted_file }}
            ${{ steps.dump.outputs.checksum_file }}
            ${{ steps.dump.outputs.metadata_file }}
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### Database Backup"
            echo ""
            echo "- Environment: `${TARGET_ENV}`"
            echo "- Transport: `${{ steps.transport.outputs.mode }}`"
            echo "- Encrypted artifact: `${{ steps.dump.outputs.artifact_name }}`"
            echo "- PostgreSQL version: `${{ steps.source.outputs.postgres_version }}`"
            echo "- Restore image metadata: `${{ steps.source.outputs.database_image || 'explicit restore_image required' }}`"
            echo "- S3 upload configured: `${DB_BACKUP_S3_BUCKET:+yes}`"
            echo "- Plaintext dump retained: `no`"
          } >> "$GITHUB_STEP_SUMMARY"
