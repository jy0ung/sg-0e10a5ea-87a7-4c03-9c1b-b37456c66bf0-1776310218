name: Database Restore Drill

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Backup environment to restore-test'
        type: choice
        required: true
        default: production
        options:
          - production
          - uat
          - staging
      backup_run_id:
        description: 'Optional successful Database Backup workflow run ID; blank selects the latest successful run'
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: db-restore-drill-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  restore-drill:
    name: Restore drill (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'production' }}
      DB_BACKUP_GPG_PASSPHRASE: ${{ secrets.DB_BACKUP_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify restore secret
        run: |
          set -euo pipefail
          if [[ -z "${DB_BACKUP_GPG_PASSPHRASE:-}" ]]; then
            echo "Missing required secret: DB_BACKUP_GPG_PASSPHRASE" >&2
            exit 1
          fi

      - name: Resolve and download backup artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BACKUP_RUN_ID: ${{ github.event.inputs.backup_run_id }}
        run: |
          set -euo pipefail
          run_id="${INPUT_BACKUP_RUN_ID:-}"
          if [[ -z "$run_id" ]]; then
            run_id="$(
              gh run list \
                --workflow db-backup.yml \
                --status success \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId'
            )"
          fi

          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "No successful Database Backup workflow run is available." >&2
            exit 1
          fi

          mkdir -p restore-source
          gh run download "$run_id" --dir restore-source

          encrypted_file="$(find restore-source -type f -name '*.dump.gpg' | head -1)"
          checksum_file="$(find restore-source -type f -name '*.dump.gpg.sha256' | head -1)"
          metadata_file="$(find restore-source -type f -name '*.dump.gpg.metadata.txt' | head -1)"

          [[ -n "$encrypted_file" && -f "$encrypted_file" ]] || { echo "Encrypted dump not found in run $run_id" >&2; exit 1; }
          [[ -n "$checksum_file" && -f "$checksum_file" ]] || { echo "Checksum not found in run $run_id" >&2; exit 1; }
          [[ -n "$metadata_file" && -f "$metadata_file" ]] || { echo "Backup metadata not found in run $run_id" >&2; exit 1; }

          backup_env="$(awk -F= '$1 == "environment" {print substr($0, index($0, "=") + 1)}' "$metadata_file")"
          if [[ "$backup_env" != "$TARGET_ENV" ]]; then
            echo "Backup run $run_id belongs to environment '$backup_env', not requested '$TARGET_ENV'." >&2
            echo "Provide an explicit backup_run_id for the requested environment." >&2
            exit 1
          fi

          expected_sha="$(awk '{print $1}' "$checksum_file" | head -1)"
          actual_sha="$(sha256sum "$encrypted_file" | awk '{print $1}')"
          if [[ -z "$expected_sha" || "$expected_sha" != "$actual_sha" ]]; then
            echo "Encrypted backup checksum mismatch." >&2
            exit 1
          fi

          database_image="$(awk -F= '$1 == "database_image" {print substr($0, index($0, "=") + 1)}' "$metadata_file")"
          created_at="$(awk -F= '$1 == "created_at_utc" {print substr($0, index($0, "=") + 1)}' "$metadata_file")"
          [[ -n "$database_image" ]] || { echo "Backup metadata is missing database_image." >&2; exit 1; }

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "encrypted_file=$encrypted_file" >> "$GITHUB_OUTPUT"
          echo "metadata_file=$metadata_file" >> "$GITHUB_OUTPUT"
          echo "database_image=$database_image" >> "$GITHUB_OUTPUT"
          echo "backup_created_at=$created_at" >> "$GITHUB_OUTPUT"

      - name: Start isolated restore database
        id: scratch
        env:
          DATABASE_IMAGE: ${{ steps.source.outputs.database_image }}
        run: |
          set -euo pipefail
          container="flc-db-restore-drill-${GITHUB_RUN_ID}"
          volume="${container}-data"

          docker pull "$DATABASE_IMAGE"
          docker volume create "$volume" >/dev/null
          docker run -d \
            --name "$container" \
            --memory 4g \
            --cpus 2 \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$volume:/var/lib/postgresql/data" \
            "$DATABASE_IMAGE" >/dev/null

          deadline=$(( $(date +%s) + 90 ))
          until docker exec "$container" pg_isready -U postgres -d postgres >/dev/null 2>&1; do
            if (( $(date +%s) >= deadline )); then
              docker logs --tail 100 "$container" >&2 || true
              echo "Scratch database did not become ready." >&2
              exit 1
            fi
            sleep 2
          done

          echo "container=$container" >> "$GITHUB_OUTPUT"
          echo "volume=$volume" >> "$GITHUB_OUTPUT"

      - name: Bootstrap Supabase roles in scratch database
        env:
          DB_CONTAINER: ${{ steps.scratch.outputs.container }}
        run: |
          set -euo pipefail
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            role_name text;
          begin
            foreach role_name in array array[
              'anon',
              'authenticated',
              'service_role',
              'authenticator',
              'supabase_auth_admin',
              'supabase_storage_admin',
              'supabase_functions_admin',
              'dashboard_user'
            ]
            loop
              if not exists (select 1 from pg_roles where rolname = role_name) then
                execute format('create role %I nologin', role_name);
              end if;
            end loop;
          end
          $$;
          SQL

          docker exec "$DB_CONTAINER" createdb -U postgres flc_restore_drill

      - name: Restore encrypted backup into scratch database
        id: restore
        env:
          DB_CONTAINER: ${{ steps.scratch.outputs.container }}
          ENCRYPTED_FILE: ${{ steps.source.outputs.encrypted_file }}
        run: |
          set -euo pipefail
          started_at="$(date +%s)"

          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "$DB_BACKUP_GPG_PASSPHRASE" \
            --decrypt "$ENCRYPTED_FILE" \
            | docker exec -i "$DB_CONTAINER" pg_restore \
                -U postgres \
                -d flc_restore_drill \
                --no-owner \
                --no-privileges \
                --exit-on-error

          finished_at="$(date +%s)"
          echo "duration_seconds=$((finished_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Run restore smoke checks
        env:
          DB_CONTAINER: ${{ steps.scratch.outputs.container }}
        run: |
          set -euo pipefail
          docker exec -i "$DB_CONTAINER" psql -U postgres -d flc_restore_drill -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            relation_name text;
          begin
            foreach relation_name in array array[
              'public.profiles',
              'public.employees',
              'public.vehicles',
              'public.deals',
              'public.invoices',
              'public.purchase_invoices',
              'public.accounting_periods',
              'public.tickets',
              'supabase_migrations.schema_migrations'
            ]
            loop
              if to_regclass(relation_name) is null then
                raise exception 'Restore smoke missing required relation: %', relation_name;
              end if;
            end loop;

            if not exists (select 1 from supabase_migrations.schema_migrations) then
              raise exception 'Restore smoke found an empty migration ledger';
            end if;
          end
          $$;
          SQL

      - name: Write restore evidence
        if: success()
        env:
          BACKUP_RUN_ID: ${{ steps.source.outputs.run_id }}
          BACKUP_CREATED_AT: ${{ steps.source.outputs.backup_created_at }}
          DATABASE_IMAGE: ${{ steps.source.outputs.database_image }}
          RESTORE_DURATION: ${{ steps.restore.outputs.duration_seconds }}
        run: |
          set -euo pipefail
          mkdir -p restore-evidence
          evidence="restore-evidence/restore-drill-${GITHUB_RUN_ID}.txt"
          {
            echo "drill_run_id=$GITHUB_RUN_ID"
            echo "environment=$TARGET_ENV"
            echo "backup_run_id=$BACKUP_RUN_ID"
            echo "backup_created_at_utc=$BACKUP_CREATED_AT"
            echo "database_image=$DATABASE_IMAGE"
            echo "restore_duration_seconds=$RESTORE_DURATION"
            echo "smoke_result=pass"
            echo "scope=logical_dump_full_restore_to_isolated_scratch_database"
          } > "$evidence"
          echo "evidence_file=$evidence" >> "$GITHUB_ENV"

      - name: Upload restore evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-evidence-${{ github.run_id }}
          path: ${{ env.evidence_file }}
          retention-days: 30

      - name: Cleanup scratch database
        if: always()
        env:
          DB_CONTAINER: ${{ steps.scratch.outputs.container }}
          DB_VOLUME: ${{ steps.scratch.outputs.volume }}
        run: |
          set +e
          if [[ -n "${DB_CONTAINER:-}" ]]; then
            docker rm -f "$DB_CONTAINER" >/dev/null 2>&1
          fi
          if [[ -n "${DB_VOLUME:-}" ]]; then
            docker volume rm "$DB_VOLUME" >/dev/null 2>&1
          fi
          exit 0

      - name: Summary
        if: always()
        run: |
          {
            echo "### Database Restore Drill"
            echo ""
            echo "- Environment: \`${TARGET_ENV}\`"
            echo "- Backup run: \`${{ steps.source.outputs.run_id }}\`"
            echo "- Backup created: \`${{ steps.source.outputs.backup_created_at }}\`"
            echo "- Scratch image: \`${{ steps.source.outputs.database_image }}\`"
            echo "- Restore duration: \`${{ steps.restore.outputs.duration_seconds }} seconds\`"
            echo "- Result: \`${{ job.status }}\`"
            echo ""
            echo "This drill validates a logical-dump restore into an isolated scratch database. It does not replace the separate PITR drill."
          } >> "$GITHUB_STEP_SUMMARY"
